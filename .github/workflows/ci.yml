name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install Taskwarrior
        run: |
          sudo apt-get update
          sudo apt-get install -y taskwarrior
          task --version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, lint, test, and build
        run: bun run check

      - name: Validate and build MCPB bundle
        run: |
          bun run mcpb:validate
          bun run mcpb:pack
          bun run mcpb:info

      - name: Smoke-test packaged Node server
        env:
          MCP_TEST_COMMAND: node
          MCP_TEST_ENTRY: ${{ runner.temp }}/taskwarrior-mcpb/server/index.js
        run: |
          unzip -q dist/taskwarrior-mcp.mcpb -d "${RUNNER_TEMP}/taskwarrior-mcpb"
          test -f "$MCP_TEST_ENTRY"
          bun test test/mcp-schema.test.ts

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install locked dependencies without build scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit all dependencies
        run: bun audit

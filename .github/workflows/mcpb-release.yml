name: Build and Release MCPB Bundle

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-mcpb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install Taskwarrior
        run: |
          sudo apt-get update
          sudo apt-get install -y taskwarrior
          task --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check

      - name: Build MCPB bundle
        run: |
          bun run mcpb:pack
          cp dist/taskwarrior-mcp.mcpb taskwarrior-mcp-${{ github.event.release.tag_name }}.mcpb

      - name: Show MCPB bundle info
        run: ./node_modules/.bin/mcpb info taskwarrior-mcp-${{ github.event.release.tag_name }}.mcpb

      - name: Upload MCPB bundle to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} taskwarrior-mcp-${{ github.event.release.tag_name }}.mcpb --clobber

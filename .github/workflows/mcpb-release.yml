name: Build and Release MCPB Bundle

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-mcpb:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install Taskwarrior
        run: |
          sudo apt-get update
          sudo apt-get install -y taskwarrior
          task --version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run checks
        run: bun run check

      - name: Build MCPB bundle
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          bun run mcpb:validate
          bun run mcpb:pack
          cp dist/taskwarrior-mcp.mcpb "taskwarrior-mcp-${RELEASE_TAG}.mcpb"

      - name: Show MCPB bundle info
        run: bun run mcpb:info

      - name: Upload MCPB bundle to release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "taskwarrior-mcp-${RELEASE_TAG}.mcpb" --clobber
